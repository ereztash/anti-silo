name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with dev and extract extras
        run: python -m pip install -e ".[dev,extract]"
      - name: Run tests
        run: python -m pytest -q
